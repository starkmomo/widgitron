[package]
name = "widgitron"
version = "0.2.6"
description = "A modular desktop widget framework for researchers and developers"
authors = ["you"]
edition = "2021"

[lib]
name = "widgitron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
log = "0.4"
env_logger = "0.10"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
shellexpand = "3.1"
glob = "0.3"
sysinfo = "0.39.6"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
quick-xml = "0.40.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["sha1"] }
sha1 = "0.10"
semver = "1.0"
keyring = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindowLevel"] }
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSString", "NSURL"] }
libloading = "0.8"
