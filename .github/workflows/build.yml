name: Build Windows and macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Widgitron-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS app + WidgetKit (Apple Silicon)
    runs-on: macos-latest
    env:
      WIDGITRON_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build app and WidgetKit extension
        run: pnpm macos:build
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Widgitron.app Widgitron-macOS-arm64.zip
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Widgitron-macOS-arm64
          path: Widgitron-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
